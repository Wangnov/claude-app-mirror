name: Mirror Claude Desktop Installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag. Defaults to a version-derived tag.
        required: false
        type: string
      force_release:
        description: Publish even when the latest release already matches current sources.
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "11 */6 * * *"

permissions:
  contents: read

env:
  R2_BUCKET_NAME: claude-app-mirror
  R2_PUBLIC_BASE_URL: https://claudeapp.agentsmirror.com
  R2_ORIGIN_BASE_URL: https://claudeapp-r2.agentsmirror.com

concurrency:
  group: claude-app-mirror
  cancel-in-progress: false

jobs:
  probe:
    name: Probe current version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.probe.outputs.should_release }}
      repair_r2_only: ${{ steps.probe.outputs.repair_r2_only }}
      release_tag: ${{ steps.probe.outputs.release_tag }}
      latest_tag: ${{ steps.probe.outputs.latest_tag }}
      skip_reason: ${{ steps.probe.outputs.skip_reason }}
      version_summary: ${{ steps.probe.outputs.version_summary }}
      manifest: ${{ steps.probe.outputs.manifest }}
    steps:
      - uses: actions/checkout@v6

      - name: Probe update API
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FORCE_RELEASE: ${{ inputs.force_release || 'false' }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash scripts/probe-release.sh

  release:
    name: Mirror and publish release
    runs-on: ubuntu-latest
    needs: probe
    if: needs.probe.outputs.should_release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Checkout agents-mirror-kit
        uses: actions/checkout@v6
        with:
          repository: Wangnov/agents-mirror-kit
          ref: v0.3.4
          path: .mirror-kit

      - name: Restore probe manifest
        if: needs.probe.outputs.repair_r2_only != 'true'
        env:
          PROBE_MANIFEST_JSON: ${{ needs.probe.outputs.manifest }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$PROBE_MANIFEST_JSON" > probe-manifest.json
          jq -e 'type == "object" and (.version | type == "string")' probe-manifest.json >/dev/null

      - name: Download installers
        if: needs.probe.outputs.repair_r2_only != 'true'
        shell: bash
        run: bash scripts/download-artifacts.sh dist probe-manifest.json

      - name: Prepare release metadata
        if: needs.probe.outputs.repair_r2_only != 'true'
        id: meta
        env:
          PROBE_RELEASE_TAG: ${{ needs.probe.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare-release-metadata.sh \
            probe-manifest.json \
            dist \
            "$R2_PUBLIC_BASE_URL" \
            "$PROBE_RELEASE_TAG"

      - name: Publish GitHub Release
        if: needs.probe.outputs.repair_r2_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          META_TAG: ${{ steps.meta.outputs.tag }}
          META_TITLE: ${{ steps.meta.outputs.title }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$META_TAG" \
            --title "$META_TITLE" \
            --notes-file release-notes.md \
            dist/Claude-mac-universal.dmg \
            dist/Claude-win-x64.msix \
            dist/Claude-win-arm64.msix \
            dist/Claude-linux-x64.deb \
            dist/Claude-linux-arm64.deb \
            SHA256SUMS.txt \
            release-manifest.json

      - name: Download verified assets from existing GitHub Release for R2 repair
        if: needs.probe.outputs.repair_r2_only == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPAIR_TAG: ${{ needs.probe.outputs.release_tag }}
          PROBE_MANIFEST_JSON: ${{ needs.probe.outputs.manifest }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REPAIR_TAG"
          mkdir -p dist repair-download
          printf '%s\n' "$PROBE_MANIFEST_JSON" > repair-download/probed-manifest.json
          gh release download "$REPAIR_TAG" \
            -p Claude-mac-universal.dmg \
            -p Claude-win-x64.msix \
            -p Claude-win-arm64.msix \
            -p Claude-linux-x64.deb \
            -p Claude-linux-arm64.deb \
            -p SHA256SUMS.txt \
            -p release-manifest.json \
            -D repair-download
          jq -e -n \
            --slurpfile probed repair-download/probed-manifest.json \
            --slurpfile rel repair-download/release-manifest.json '
            def eq($x; $y):
              ($x.url == $y.url) and ($x.contentLength == $y.contentLength)
              and (((($x.md5 // "") == "") or (($y.md5 // "") == "")) or ($x.md5 == $y.md5));
            ($probed[0].sources) as $p | ($rel[0].sources) as $r
            | eq($p.macos.universal; $r.macos.universal)
              and eq($p.windows.x64; $r.windows.x64)
              and eq($p.windows.arm64; $r.windows.arm64)
              and eq($p.linux.x64; $r.linux.x64)
              and eq($p.linux.arm64; $r.linux.arm64)
          ' >/dev/null
          (
            cd repair-download
            manifest_sha="$(sha256sum release-manifest.json | awk '{print tolower($1)}')"
            awk -v manifest_sha="$manifest_sha" '
              NF == 0 { next }
              {
                digest = tolower($1)
                name = $0
                sub(/^[^[:space:]]+[[:space:]]+\*?/, "", name)
                if (digest !~ /^[0-9a-f]{64}$/ || name == "" || (name in seen)) exit 1
                seen[name] = digest
                count++
              }
              END {
                if (count != 6) exit 1
                if (seen["release-manifest.json"] != manifest_sha) exit 1
                if (!("Claude-mac-universal.dmg" in seen)) exit 1
                if (!("Claude-win-x64.msix" in seen)) exit 1
                if (!("Claude-win-arm64.msix" in seen)) exit 1
                if (!("Claude-linux-x64.deb" in seen)) exit 1
                if (!("Claude-linux-arm64.deb" in seen)) exit 1
              }
            ' SHA256SUMS.txt
            for pair in \
              "Claude-mac-universal.dmg:.sources.macos.universal.sha256" \
              "Claude-win-x64.msix:.sources.windows.x64.sha256" \
              "Claude-win-arm64.msix:.sources.windows.arm64.sha256" \
              "Claude-linux-x64.deb:.sources.linux.x64.sha256" \
              "Claude-linux-arm64.deb:.sources.linux.arm64.sha256"; do
              fname="${pair%%:*}"
              jq_expr="${pair#*:}"
              expected_hex="$(jq -r "$jq_expr // \"\"" release-manifest.json | tr '[:upper:]' '[:lower:]')"
              [[ "$expected_hex" =~ ^[0-9a-f]{64}$ ]]
              grep -Fiq "${expected_hex}  ${fname}" SHA256SUMS.txt
            done
            sha256sum --strict -c SHA256SUMS.txt
          )
          mv repair-download/SHA256SUMS.txt SHA256SUMS.txt
          mv repair-download/release-manifest.json release-manifest.json
          mv repair-download/Claude-* dist/

      - name: Remove latest links from previous release notes
        if: needs.probe.outputs.repair_r2_only != 'true' && needs.probe.outputs.latest_tag != '' && needs.probe.outputs.latest_tag != steps.meta.outputs.tag
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREV_LATEST_TAG: ${{ needs.probe.outputs.latest_tag }}
        shell: bash
        run: bash .mirror-kit/scripts/remove-latest-links-from-release-notes.sh "$PREV_LATEST_TAG"

      - name: Ensure AWS CLI
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then
            python3 -m pip install --user awscli
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Sync release assets to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_S3_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          META_TAG: ${{ steps.meta.outputs.tag || needs.probe.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mac="dist/Claude-mac-universal.dmg"
          win_x64="dist/Claude-win-x64.msix"
          win_arm64="dist/Claude-win-arm64.msix"
          linux_x64="dist/Claude-linux-x64.deb"
          linux_arm64="dist/Claude-linux-arm64.deb"

          test -f "$mac"
          test -f "$win_x64"
          test -f "$win_arm64"
          test -f "$linux_x64"
          test -f "$linux_arm64"

          staging_prefix="staging/${META_TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup_staging() {
            bash .mirror-kit/scripts/clear-r2-prefix.sh "$R2_BUCKET_NAME" "$staging_prefix" || true
          }
          trap cleanup_staging EXIT

          upload_aliases() {
            local prefix="$1"
            bash .mirror-kit/scripts/sync-r2.sh --object "$R2_BUCKET_NAME" "$prefix/mac" "$mac" Claude-mac-universal.dmg
            bash .mirror-kit/scripts/sync-r2.sh --object "$R2_BUCKET_NAME" "$prefix/win-x64" "$win_x64" Claude-win-x64.msix
            bash .mirror-kit/scripts/sync-r2.sh --object "$R2_BUCKET_NAME" "$prefix/win-arm64" "$win_arm64" Claude-win-arm64.msix
            bash .mirror-kit/scripts/sync-r2.sh --object "$R2_BUCKET_NAME" "$prefix/linux-x64" "$linux_x64" Claude-linux-x64.deb
            bash .mirror-kit/scripts/sync-r2.sh --object "$R2_BUCKET_NAME" "$prefix/linux-arm64" "$linux_arm64" Claude-linux-arm64.deb
            bash .mirror-kit/scripts/sync-r2.sh --object "$R2_BUCKET_NAME" "$prefix/checksums" SHA256SUMS.txt SHA256SUMS.txt
            bash .mirror-kit/scripts/sync-r2.sh --object "$R2_BUCKET_NAME" "$prefix/manifest" release-manifest.json release-manifest.json
          }

          upload_aliases "$staging_prefix"
          aws s3 cp "s3://$R2_BUCKET_NAME/$staging_prefix/manifest" /tmp/r2-staging-manifest.json \
            --endpoint-url "$R2_S3_ENDPOINT" \
            --region "${AWS_DEFAULT_REGION:-auto}" \
            --no-progress
          cmp release-manifest.json /tmp/r2-staging-manifest.json

          bash .mirror-kit/scripts/sync-r2.sh --object "$R2_BUCKET_NAME" latest/mac "$mac" Claude-mac-universal.dmg
          bash .mirror-kit/scripts/sync-r2.sh --object "$R2_BUCKET_NAME" latest/win-x64 "$win_x64" Claude-win-x64.msix
          bash .mirror-kit/scripts/sync-r2.sh --object "$R2_BUCKET_NAME" latest/win-arm64 "$win_arm64" Claude-win-arm64.msix
          bash .mirror-kit/scripts/sync-r2.sh --object "$R2_BUCKET_NAME" latest/linux-x64 "$linux_x64" Claude-linux-x64.deb
          bash .mirror-kit/scripts/sync-r2.sh --object "$R2_BUCKET_NAME" latest/linux-arm64 "$linux_arm64" Claude-linux-arm64.deb
          bash .mirror-kit/scripts/sync-r2.sh --object "$R2_BUCKET_NAME" latest/checksums SHA256SUMS.txt SHA256SUMS.txt
          bash .mirror-kit/scripts/sync-r2.sh --object "$R2_BUCKET_NAME" latest/manifest release-manifest.json release-manifest.json

          curl -fsSL \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 120 \
            "$R2_PUBLIC_BASE_URL/latest/manifest?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -o /tmp/r2-public-manifest.json
          cmp release-manifest.json /tmp/r2-public-manifest.json

      - name: Trigger Cloudflare secondary S3 sync
        env:
          CF_SECONDARY_SYNC_URL: ${{ secrets.CF_SECONDARY_SYNC_URL }}
          CF_SECONDARY_SYNC_TOKEN: ${{ secrets.CF_SECONDARY_SYNC_TOKEN }}
          SECONDARY_SYNC_MODE: start
          SECONDARY_SYNC_RELEASE_TAG: ${{ steps.meta.outputs.tag || needs.probe.outputs.release_tag }}
          SECONDARY_SYNC_FORCE: ${{ inputs.force_release || 'false' }}
          SECONDARY_SYNC_TIMEOUT_SECONDS: 2400
        shell: bash
        run: bash scripts/trigger-secondary-sync.sh

  no_changes:
    name: No new version
    runs-on: ubuntu-latest
    needs: probe
    if: needs.probe.outputs.should_release != 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Report current state
        env:
          SKIP_REASON: ${{ needs.probe.outputs.skip_reason }}
          VERSION_SUMMARY: ${{ needs.probe.outputs.version_summary }}
        run: |
          echo "No new Claude desktop version detected."
          echo "$SKIP_REASON"
          echo "$VERSION_SUMMARY"

      - name: Reconcile Cloudflare secondary S3 sync
        env:
          CF_SECONDARY_SYNC_URL: ${{ secrets.CF_SECONDARY_SYNC_URL }}
          CF_SECONDARY_SYNC_TOKEN: ${{ secrets.CF_SECONDARY_SYNC_TOKEN }}
          SECONDARY_SYNC_MODE: reconcile
          SECONDARY_SYNC_RELEASE_TAG: ${{ needs.probe.outputs.latest_tag }}
          SECONDARY_SYNC_FORCE: false
          SECONDARY_SYNC_TIMEOUT_SECONDS: 2400
        shell: bash
        run: bash scripts/trigger-secondary-sync.sh
