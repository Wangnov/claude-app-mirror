name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Checkout agents-mirror-kit
        uses: actions/checkout@v6
        with:
          repository: Wangnov/agents-mirror-kit
          ref: v0.3.4
          path: .mirror-kit

      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

      - name: Syntax-check shell scripts
        shell: bash
        run: bash -n scripts/*.sh

      - name: Shellcheck
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh

      - name: Validate GitHub Actions
        shell: bash
        run: actionlint

      - name: Test GCS probe hash parsing and artifact download verification
        shell: bash
        run: bash scripts/test-download-artifacts.sh

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate download router config against kit worker
        shell: bash
        run: node cloudflare/download-router/validate-config.mjs

      - name: Validate secondary-sync worker
        shell: bash
        run: |
          npm ci --prefix cloudflare/secondary-sync
          npm run check --prefix cloudflare/secondary-sync
